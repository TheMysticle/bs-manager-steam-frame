# Windows x64 installer (NSIS), unsigned.
#   push a tag frame-v*-win  -> build and publish a GitHub release in this repository
#   run manually             -> build only (installer as a workflow artifact)

name: Windows x64

on:
    push:
        tags: ["frame-v*-win"]
    workflow_dispatch:

permissions:
    contents: write

jobs:
    windows:
        runs-on: windows-latest

        steps:
            - name: Check out Git repository
              uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
              with:
                  version: 10.34.4

            - uses: ./.github/actions/setup-downloader

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: "pnpm"
                  cache-dependency-path: |
                      pnpm-lock.yaml
                      release/app/pnpm-lock.yaml

            # Native modules need lifecycle scripts, restricted by allowBuilds.
            - run: pnpm install --frozen-lockfile # NOSONAR
            - name: Build Windows helper executables
              run: pnpm run build-rust-scripts
            - run: pnpm run build

            - name: Build installer
              shell: bash
              env:
                  SKIP_SIGNING: "true"
                  CSC_IDENTITY_AUTO_DISCOVERY: "false"
              run: |
                  pnpm exec electron-builder --config electron-builder.config.js --publish never \
                      --win nsis --x64 "-c.publish.owner=${{ github.repository_owner }}"
                  (cd release/build && sha256sum *.exe > SHA256SUMS)

            - uses: actions/upload-artifact@v4
              with:
                  name: bsmanager-windows-x64
                  path: |
                      release/build/*.exe
                      release/build/latest.yml
                      release/build/SHA256SUMS

            - name: Create release
              if: github.ref_type == 'tag'
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  cat > notes.md <<'EOF2'
                  Windows x64 build of this fork (unsigned installer), including the experimental
                  Beat Saber 1.45.1 mod list, so a Windows instance can be patched to 1.45.1.

                  Windows SmartScreen will warn about an unknown publisher because the installer is
                  not code-signed: choose "More info" -> "Run anyway".

                  Unofficial fork of [BSManager](https://github.com/Zagrios/bs-manager).
                  EOF2
                  gh release create "$GITHUB_REF_NAME" release/build/*.exe release/build/latest.yml release/build/SHA256SUMS \
                      --verify-tag --title "BSManager $GITHUB_REF_NAME (Windows x64)" --notes-file notes.md
