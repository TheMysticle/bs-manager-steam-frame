# Windows x64 installer (NSIS), unsigned.
#   push a tag frame-v*-win  -> build and publish a GitHub release in this repository
#   run manually             -> build only (installer as a workflow artifact)

name: Windows x64

on:
    push:
        # Same tag namespace as the manually-uploaded ARM64 tarball (packaging/install-release.sh),
        # so both platforms land in one release instead of "latest" pointing at whichever shipped
        # last with no guarantee it carries every platform's asset (#3).
        tags: ["frame-v*"]
    workflow_dispatch:

permissions:
    contents: write

jobs:
    windows:
        runs-on: windows-latest

        steps:
            - name: Check out Git repository
              uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
              with:
                  version: 10.34.4

            - uses: ./.github/actions/setup-downloader

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: "pnpm"
                  cache-dependency-path: |
                      pnpm-lock.yaml
                      release/app/pnpm-lock.yaml

            # Native modules need lifecycle scripts, restricted by allowBuilds.
            - run: pnpm install --frozen-lockfile # NOSONAR
            - name: Build Windows helper executables
              run: pnpm run build-rust-scripts
            - run: pnpm run build

            - name: Build installer
              shell: bash
              env:
                  SKIP_SIGNING: "true"
                  CSC_IDENTITY_AUTO_DISCOVERY: "false"
              run: |
                  pnpm exec electron-builder --config electron-builder.config.js --publish never \
                      --win nsis --x64 "-c.publish.owner=${{ github.repository_owner }}"
                  (cd release/build && sha256sum *.exe > SHA256SUMS)

            - uses: actions/upload-artifact@v4
              with:
                  name: bsmanager-windows-x64
                  path: |
                      release/build/*.exe
                      release/build/latest.yml
                      release/build/SHA256SUMS

            - name: Publish Windows assets into this tag's release
              if: github.ref_type == 'tag'
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  ASSETS=(release/build/*.exe release/build/latest.yml release/build/SHA256SUMS)

                  # The ARM64 tarball for this same tag may already be uploaded by hand (it can't be
                  # built on GitHub Actions), or it may land after this workflow runs -- either way,
                  # both platforms belong in ONE release per tag, not one each. If the release already
                  # exists, just add these assets to it instead of failing or creating a duplicate.
                  if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
                      gh release upload "$GITHUB_REF_NAME" "${ASSETS[@]}" --clobber
                  else
                      cat > notes.md <<'EOF2'
                  BSManager for this fork, including the experimental Beat Saber 1.45.1 mod list.

                  **Windows x64:** `BSManager.Setup.*.exe` (unsigned installer — Windows SmartScreen
                  will warn about an unknown publisher: choose "More info" -> "Run anyway").

                  **Steam Frame (ARM64 Linux):** the tarball and `install-release.sh`, if not already
                  attached below, are uploaded separately to this same release. One-line install:
                  ```sh
                  curl -fsSL https://raw.githubusercontent.com/TheMysticle/bs-manager-steam-frame/arm64-integration/packaging/install-release.sh | bash
                  ```

                  If you're comfortable with it, building from source (`git clone` + `./install.sh`)
                  is recommended over either prebuilt download above — it's built and tested locally
                  far more often than a release is cut, so it won't lag behind the latest fixes.

                  Unofficial fork of [BSManager](https://github.com/Zagrios/bs-manager).
                  EOF2
                      gh release create "$GITHUB_REF_NAME" "${ASSETS[@]}" \
                          --verify-tag --title "BSManager $GITHUB_REF_NAME" --notes-file notes.md
                  fi
